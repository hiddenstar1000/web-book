apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-book-frontend
  labels:
    app: web-book-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-book-frontend
  template:
    metadata:
      labels:
        app: web-book-frontend
    spec:
      containers:
        - name: frontend
          image: web-book-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "http://web-book-backend-service:3001/api/v1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
