apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-book-backend
  labels:
    app: web-book-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-book-backend
  template:
    metadata:
      labels:
        app: web-book-backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/hiddenstar1000/web-book-backend:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: web-book-backend-config
                  key: PORT
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: web-book-backend-secret
                  key: MONGODB_URI
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/users
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/users
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
