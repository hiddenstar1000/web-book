name: Release

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'DEV' || 'PROD' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ secrets.GH_USER }}/web-book-backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ secrets.GH_USER }}/web-book-frontend:${{ env.IMAGE_TAG }}

      - name: Validate Kubernetes Manifests
        run: |
          kubectl kustomize k8s/dev/ > /dev/null
          kubectl kustomize k8s/prod/ > /dev/null
          echo "Kubernetes dev and prod manifests validated successfully"

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            echo "Deploying ${{ env.IMAGE_TAG }} build to server..."
            if [ "${{ github.ref_name }}" = "main" ]; then
              sudo su -
              echo "=== Executing PROD Deployment (MicroK8s) ==="
              microk8s kubectl apply -k k8s/prod/
              microk8s kubectl rollout restart deployment/web-book-backend -n app-web-book-prod
              microk8s kubectl rollout restart deployment/web-book-frontend -n app-web-book-prod
            else
              sudo su -
              echo "=== Executing DEV Deployment (MicroK8s) ==="
              microk8s kubectl apply -k k8s/dev/
              microk8s kubectl rollout restart deployment/web-book-backend -n app-web-book-dev
              microk8s kubectl rollout restart deployment/web-book-frontend -n app-web-book-dev
            fi
